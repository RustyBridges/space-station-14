# ---- Station / map ----

- type: entity
  id: DerelictTugStation
  parent:
  - BaseStation
  - BaseStationCargo
  - BaseStationJobsSpawning
  - BaseStationRecords
  - BaseStationAlertLevels
  - BaseStationNanotrasen
  components:
  - type: Transform
  - type: StationBankAccount
    primaryCut: 1
    increasePerSecond: 0

- type: gameMap
  id: DerelictCrewShip
  mapName: 'Salvage Tug'
  mapPath: /Maps/_Derelict/crew_ship.yml
  isGrid: true
  minPlayers: 0
  stations:
    Tug:
      stationProto: DerelictTugStation
      components:
      - type: StationNameSetup
        mapNameTemplate: 'ST-Magpie'
      - type: StationJobs
        overflowJobs:
        - DerelictSalvager
        availableJobs:
          DerelictSalvager: [ -1, -1 ]

- type: gameMapPool
  id: DerelictMapPool
  maps:
  - DerelictCrewShip

# ---- Preset / rule ----

- type: gamePreset
  id: Derelict
  alias:
  - derelict
  name: derelict-title
  description: derelict-description
  showInVote: true
  rules:
  - DerelictRun

- type: entity
  id: DerelictRun
  parent: BaseGameRule
  components:
  - type: DerelictRunRule
    sites:
    - DerelictSiteDropship
    - DerelictSiteWhiteship
    - DerelictSiteOutpost
    - DerelictSiteHydro
    - DerelictSiteAiSat
    - DerelictSitePrisonShip
    - DerelictSiteInterchange
    monsters:
    - DerelictMobWatcher
    - DerelictMobListener
    - DerelictMobStalker
    scrap:
    - SalvageSpawnerScrapCommon
    - SalvageSpawnerScrapCommon
    - SalvageSpawnerScrapCommon
    - SalvageSpawnerScrapValuable
    - SalvageSpawnerScrapValuable
    - SalvageSpawnerTreasure
    - SalvageSpawnerEquipment

# ---- Sites ----

- type: derelictSite
  id: DerelictSiteDropship
  name: derelict-site-dropship
  mapPath: /Maps/Ruins/syndicate_dropship.yml
